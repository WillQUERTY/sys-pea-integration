<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 440" role="img" aria-label="Khemia">
  <title>Khemia</title>
  <defs>
    <linearGradient id="kh-stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1FA374"/>
      <stop offset="1" stop-color="#0B5C46"/>
    </linearGradient>
    <linearGradient id="kh-stem-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E6F54"/>
      <stop offset="1" stop-color="#084535"/>
    </linearGradient>
    <linearGradient id="kh-arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0F7356"/>
      <stop offset="1" stop-color="#27B583"/>
    </linearGradient>
    <linearGradient id="kh-leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A4E3C"/>
      <stop offset="1" stop-color="#14855F"/>
    </linearGradient>
    <linearGradient id="kh-node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8BE4F"/>
      <stop offset="1" stop-color="#D98912"/>
    </linearGradient>
    <linearGradient id="kh-gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD978"/>
      <stop offset="1" stop-color="#D98A0F"/>
    </linearGradient>
    <radialGradient id="kh-glow">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#FFC94D" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Cadena molecular (anillos hexagonales) ── -->
  <g fill="none" stroke="#136B51" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M36 96 L64 114 L50 138"/>
    <path d="M50 138 L76 153 L76 183 L50 198 L24 183 L24 153 Z"/>
    <path d="M50 198 L50 232"/>
    <path d="M50 232 L76 247 L76 277 L50 292 L24 277 L24 247 Z"/>
    <path d="M50 292 L50 326"/>
    <path d="M50 326 L76 341 L76 371 L50 386 L24 371 L24 341 Z"/>
    <path d="M50 386 L36 410"/>
    <path d="M76 247 L92 238"/>
    <path d="M76 371 L92 380"/>
  </g>

  <!-- ── Letra K ── -->
  <polygon points="80,90 138,90 138,400 80,400" fill="url(#kh-stem)"/>
  <polygon points="126,96 138,90 138,400 126,400" fill="url(#kh-stem-side)"/>
  <polygon points="138,228 262,96 318,96 167,257 138,257" fill="url(#kh-arm)"/>
  <polygon points="138,257 167,257 320,400 250,400 138,295" fill="url(#kh-leg)"/>
  <polygon points="167,257 320,400 298,400 156,268" fill="#0A4636" opacity="0.55"/>
  <polygon points="80,90 88,90 88,400 80,400" fill="#FFFFFF" opacity="0.12"/>

  <!-- nodos de la cadena -->
  <g fill="#17936A" stroke="#0B5240" stroke-width="2">
    <path id="kh-hex" d="M0 -7 L6 -3.5 L6 3.5 L0 7 L-6 3.5 L-6 -3.5 Z" transform="translate(36 96)"/>
    <use href="#kh-hex" transform="translate(28 18)"/>
    <use href="#kh-hex" transform="translate(14 42)"/>
    <use href="#kh-hex" transform="translate(40 57)"/>
    <use href="#kh-hex" transform="translate(40 87)"/>
    <use href="#kh-hex" transform="translate(14 102)"/>
    <use href="#kh-hex" transform="translate(-12 87)"/>
    <use href="#kh-hex" transform="translate(-12 57)"/>
    <use href="#kh-hex" transform="translate(14 136)"/>
    <use href="#kh-hex" transform="translate(40 151)"/>
    <use href="#kh-hex" transform="translate(40 181)"/>
    <use href="#kh-hex" transform="translate(14 196)"/>
    <use href="#kh-hex" transform="translate(-12 181)"/>
    <use href="#kh-hex" transform="translate(-12 151)"/>
    <use href="#kh-hex" transform="translate(14 230)"/>
    <use href="#kh-hex" transform="translate(40 245)"/>
    <use href="#kh-hex" transform="translate(40 275)"/>
    <use href="#kh-hex" transform="translate(14 290)"/>
    <use href="#kh-hex" transform="translate(-12 275)"/>
    <use href="#kh-hex" transform="translate(-12 245)"/>
    <use href="#kh-hex" transform="translate(0 314)"/>
  </g>

  <!-- ── Red de datos dorada ── -->
  <g stroke="#E3A12F" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M96 382 L200 178"/>
    <path d="M96 382 L266 158"/>
    <path d="M200 178 L214 92"/>
    <path d="M200 178 L260 110"/>
    <path d="M214 92 L242 62 L260 110"/>
    <path d="M214 92 L260 110"/>
    <path d="M260 110 L266 158 L312 136 L260 110"/>
  </g>
  <circle cx="260" cy="110" r="26" fill="url(#kh-glow)"/>
  <g fill="url(#kh-node)" stroke="#B9710C" stroke-width="2">
    <circle cx="96" cy="382" r="8"/>
    <circle cx="200" cy="178" r="9"/>
    <circle cx="214" cy="92" r="7"/>
    <circle cx="242" cy="62" r="6"/>
    <circle cx="266" cy="158" r="8"/>
    <circle cx="312" cy="136" r="8"/>
  </g>
  <circle cx="260" cy="110" r="9" fill="#FFF4CF" stroke="#F2B53A" stroke-width="2"/>

  <!-- ── Gema (oro alquímico) ── -->
  <circle cx="306" cy="76" r="50" fill="url(#kh-glow)" opacity="0.8"/>
  <path d="M306 44 L334 60 L334 92 L306 108 L278 92 L278 60 Z" fill="url(#kh-gem)" stroke="#B9710C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M306 58 L320 66 L320 86 L306 94 L292 86 L292 66 Z" fill="#FFE29A" stroke="#C98110" stroke-width="2" stroke-linejoin="round"/>
  <g stroke="#C98110" stroke-width="2" stroke-linecap="round">
    <path d="M306 44 L306 58"/>
    <path d="M334 60 L320 66"/>
    <path d="M334 92 L320 86"/>
    <path d="M306 108 L306 94"/>
    <path d="M278 92 L292 86"/>
    <path d="M278 60 L292 66"/>
  </g>
  <path d="M296 68 L306 62 L306 74 Z" fill="#FFFFFF" opacity="0.7"/>

  <!-- destellos -->
  <g fill="#F5B33A">
    <circle cx="290" cy="22" r="4"/>
    <circle cx="346" cy="38" r="3.5"/>
    <circle cx="356" cy="100" r="3"/>
    <circle cx="352" cy="64" r="2"/>
    <circle cx="268" cy="34" r="2"/>
  </g>
</svg>
